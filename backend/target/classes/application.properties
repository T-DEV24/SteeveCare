# ═══════════════════════════════════════════════════════
# SteevaCare — application.properties
# Backend port : 8082 | Frontend CORS : http://localhost:4200
# ═══════════════════════════════════════════════════════

# ── Serveur ──────────────────────────────────────────
server.port=8082
server.servlet.context-path=/

# ── Base de données MySQL ─────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/steevacare?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Douala&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false

# ── Jackson (serialisation JSON) ──────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Africa/Douala
spring.jackson.default-property-inclusion=non_null

# ── JWT ───────────────────────────────────────────────
# Clé secrète Base64 (256 bits minimum pour HS256)
jwt.secret=U3RlZXZhQ2FyZVNlY3JldEtleTIwMjRRdWFtVGVjaHNBZnJpcXVlU2VjdXJlS2V5TXVzdEJlMjU2Qml0c0xvbmdBdExlYXN0
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ── WebSocket ─────────────────────────────────────────
spring.websocket.path=/ws

# ── Logging ───────────────────────────────────────────
logging.level.root=WARN
logging.level.com.quamtechs.steevacare=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# ── Multipart (upload photos) ─────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
