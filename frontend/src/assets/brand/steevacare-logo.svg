<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SteevaCare</title>
  <desc id="desc">Logo SteevaCare, télémédecine pour l'Afrique.</desc>
  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A6DD9"/>
      <stop offset="52%" stop-color="#0053B5"/>
      <stop offset="100%" stop-color="#003B86"/>
    </linearGradient>
    <linearGradient id="green" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8DD63F"/>
      <stop offset="46%" stop-color="#32A852"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#006B3C"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#001B3A" flood-opacity="0.32"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0A253D" flood-opacity="0.24"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <ellipse cx="512" cy="502" rx="130" ry="14" fill="#0A5A77" opacity="0.28"/>

    <path d="M511 483 C478 450 428 422 394 386 C337 326 360 242 427 229 C462 222 493 237 512 262 C532 237 563 222 598 229 C665 242 688 326 631 386 C597 422 545 450 511 483 Z"
          fill="none" stroke="url(#blue)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M416 228 C404 214 392 207 377 206" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
    <path d="M607 228 C619 214 632 207 646 206" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="379" cy="206" rx="20" ry="13" fill="url(#blue)" transform="rotate(14 379 206)"/>
    <ellipse cx="646" cy="206" rx="20" ry="13" fill="url(#blue)" transform="rotate(-14 646 206)"/>

    <path d="M465 280 L512 257 L574 268 L609 325 L590 388 L541 421 L485 408 L439 368 L421 316 Z"
          fill="url(#green)"/>
    <path d="M465 280 C479 298 482 314 472 330 C493 326 511 336 521 358 C537 351 555 353 572 364 C564 392 552 411 541 421 L485 408 L439 368 L421 316 Z"
          fill="url(#darkGreen)" opacity="0.62"/>
    <path d="M495 407 L460 448 L431 374" fill="none" stroke="#013E52" stroke-width="7" stroke-linejoin="round" opacity="0.72"/>

    <g transform="translate(599 300)" filter="url(#softShadow)">
      <rect x="0" y="0" width="88" height="66" rx="10" fill="url(#blue)"/>
      <path d="M88 19 L119 4 C125 1 131 5 131 12 L131 54 C131 61 125 65 119 62 L88 47 Z" fill="url(#blue)"/>
      <rect x="32" y="15" width="25" height="38" rx="2" fill="#FFFFFF"/>
      <rect x="19" y="28" width="51" height="14" rx="2" fill="#FFFFFF"/>
      <rect x="57" y="31" width="18" height="9" rx="1" fill="#75CF3A"/>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <text x="228" y="615" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="118" fill="#004B9B">Steeva</text>
    <text x="568" y="615" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="118" fill="#108334">Care</text>
  </g>

  <g opacity="0.86">
    <line x1="247" y1="660" x2="303" y2="660" stroke="#40464D" stroke-width="4"/>
    <text x="322" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="32" fill="#40464D">Télémédecine pour l’Afrique</text>
    <line x1="724" y1="660" x2="780" y2="660" stroke="#40464D" stroke-width="4"/>
  </g>
</svg>
